name: SmartBrain council
on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes, 24/7
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brain
  cancel-in-progress: false
jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Convene the council
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAIN_MODEL: ${{ vars.BRAIN_MODEL || 'claude-sonnet-4-5' }}
        run: python brain.py
      - name: Publish brain.txt
        run: |
          git config user.name "smartbrain"
          git config user.email "smartbrain@users.noreply.github.com"
          git add brain.txt brain.json brain_log.md
          git commit -m "brain $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git push
